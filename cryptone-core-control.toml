# Индивидуальная защита частоты ядра. Изменения применяются каждые 5 секунд.
# Исходная частота всегда берётся из HiveOS; файл не задаёт новый разгон.
# Верхний предел каждой карты — только её фиксация в HiveOS.
# Частоты — МГц, температуры — °C, задержки — секунды. Только целые числа.

[defaults]
min_core_mhz = 2400
step_mhz = 50
hot_c = 68
cool_c = 65
hot_hold_seconds = 180
cool_hold_seconds = 180
emergency_c = 75

[rig]
# UUID менять только после остановки службы и проверки аппаратного состава.
gpu_uuids = [
  "GPU-00000000-0000-0000-0000-000000000001",
  "GPU-00000000-0000-0000-0000-000000000002",
  "GPU-00000000-0000-0000-0000-000000000003",
  "GPU-00000000-0000-0000-0000-000000000004",
]

# Для индивидуальных настроек уберите # у нужного раздела и параметров.
# Остальные значения наследуются из [defaults].
# [gpu."GPU-00000000-0000-0000-0000-000000000001"]
# min_core_mhz = 2450
# step_mhz = 50

# [gpu."GPU-00000000-0000-0000-0000-000000000002"]
# hot_c = 68

# [gpu."GPU-00000000-0000-0000-0000-000000000003"]
# hot_hold_seconds = 240

# [gpu."GPU-00000000-0000-0000-0000-000000000004"]
# cool_hold_seconds = 240

# Снижение: hot_c непрерывно hot_hold_seconds при максимальном разрешённом
# PWM корпуса и этой карты (допуск 2 п.п.). Повторные шаги с той же задержкой.
# Повышение: <= cool_c непрерывно cool_hold_seconds; не выше частоты в HiveOS.
# При >= emergency_c — минимум сразу. Выход: <= cool_c всю задержку.
# Остановка майнера остаётся штатной защите HiveOS.
